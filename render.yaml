databases:
  - name: searchok-db
    databaseName: app_db
    user: postgres
    plan: free

services:
  - type: web
    name: searchok
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: searchok-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads
